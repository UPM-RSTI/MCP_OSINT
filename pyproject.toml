[project]
name = "tfm-osint-llm"
version = "0.1.0"
description = "Sistema multiagente basado en LLMs para el reporte automatizado de eventos OSINT de ciberseguridad (TFM)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "langchain-aws>=0.2",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
notebook = ["jupyter>=1.0", "pandas>=2.2", "matplotlib>=3.8"]
# Prueba de concepto: disparo automático del pipeline al consumir un evento OSINT normalizado
# de un topic Kafka, en vez de solo bajo petición del usuario (CLI/Streamlit). Extra aparte,
# no forma parte del alcance principal cerrado del proyecto — ver scripts/kafka_consumer.py.
kafka = ["aiokafka>=0.11"]
# Incluye weasyprint (== extra "pdf"): la pestaña Historial de app.py permite descargar
# cada diagnóstico como PDF, así que instalar la demo ya debe traer esa función sin
# necesitar un segundo extra aparte.
frontend = ["streamlit>=1.38", "weasyprint>=62.0"]

[project.scripts]
tfm-osint = "tfm_osint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfm_osint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
